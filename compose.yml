name: exposure-radar

services:
  spacetimedb-init:
    image: clockworklabs/spacetime:v2.8.2
    user: root
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /stdb/data && chown -R spacetime:spacetime /stdb
    volumes:
      - spacetimedb-data:/stdb
    restart: "no"

  spacetimedb:
    image: clockworklabs/spacetime:v2.8.2
    command:
      - start
      - --listen-addr=0.0.0.0:3000
      - --data-dir=/stdb/data
      - --jwt-pub-key-path=/stdb/identity.pub
      - --jwt-priv-key-path=/stdb/identity.key
      - --non-interactive
    ports:
      - "${SPACETIMEDB_PORT:-3000}:3000"
    volumes:
      - spacetimedb-data:/stdb
    depends_on:
      spacetimedb-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /bin/bash
        - -c
        - exec 3<>/dev/tcp/127.0.0.1/3000
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  spacetimedb-publisher:
    image: ghcr.io/nehoko/exposure-radar-publisher:${EXPOSURE_RADAR_VERSION:-latest}
    environment:
      SPACETIMEDB_URL: http://spacetimedb:3000
      SPACETIMEDB_DATABASE: ${SPACETIMEDB_DATABASE:-exposure-radar}
    volumes:
      - spacetimedb-publisher-data:/spacetime-cli
    depends_on:
      spacetimedb:
        condition: service_healthy
    restart: "no"

  frontend:
    image: ghcr.io/nehoko/exposure-radar-frontend:${EXPOSURE_RADAR_VERSION:-latest}
    environment:
      EXPOSURE_RADAR_DEBUG: ${EXPOSURE_RADAR_DEBUG:-false}
    ports:
      - "${EXPOSURE_RADAR_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - deno
        - eval
        - const response = await fetch('http://127.0.0.1:8000/'); if (!response.ok) Deno.exit(1)
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      spacetimedb-publisher:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  spacetimedb-data:
  spacetimedb-publisher-data:
